[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-scientific-review-ai"
version = "0.1.0"
description = "PRISMA-aligned agentic scientific review workflow with Gemini, LangGraph and auditable RAG"
requires-python = ">=3.11"
dependencies = [
 "langgraph>=1.0,<3",
 "google-genai>=1.30,<4",
 "streamlit>=1.40,<3",
 "requests>=2.31,<3",
 "defusedxml>=0.7,<1",
 "pydantic>=2.8,<3",
 "numpy>=1.26,<3",
 "scikit-learn>=1.4,<2",
 "pymupdf>=1.24,<2",
 "python-dotenv>=1,<2",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-cov>=5,<8"]

[project.scripts]
reviewai = "reviewai.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
